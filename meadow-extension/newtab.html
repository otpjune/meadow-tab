<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<link rel="stylesheet" href="newtab.css">
</head>
<body>
<div id="bg"></div>

<button id="gear" class="glass round" aria-label="Settings">⋯</button>
<div id="settings" class="glass pop" hidden>
  <button id="editLayout">Edit layout</button>
  <div class="sec">Background</div>
  <button id="bgDefault">Default background</button>
  <button id="bgPick">Upload your own…</button>

  <input id="bgFile" type="file" accept="image/*" hidden>
</div>

<div id="editbar" class="glass" hidden>
  <span id="editMsg"></span>
  <button id="layoutReset" class="pill ghost" hidden>Reset layout</button>
  <button id="editDone" class="pill">Done</button>
</div>

<div id="guideV" class="guide" hidden></div>
<div id="guideH" class="guide" hidden></div>

<main>
  <section id="clock" class="blk" data-k="clock">
    <div id="date"></div>
    <div id="time"><span id="hm"></span><span id="ap"></span></div>
  </section>

  <section id="timer" class="glass blk" data-k="timer" data-state="idle" aria-label="Focus timer">
    <button id="tMinus" class="round" aria-label="Subtract 5 minutes">−</button>
    <span id="tEdit"><input id="tInput" type="number" min="1" max="180" value="25" aria-label="Minutes"><span>min</span></span>
    <span id="tShow" hidden>25:00</span>
    <button id="tPlus" class="round" aria-label="Add 5 minutes">+</button>
    <span id="tPhase" hidden></span>
    <button id="tMain" class="pill">Start</button>
    <button id="tReset" class="pill ghost" hidden>Reset</button>
  </section>

  <div class="searchwrap blk" data-k="search">
    <form id="searchForm" class="glass search" autocomplete="off">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="text" placeholder="Search Google or type a URL" aria-label="Search" spellcheck="false">
    </form>
    <ul id="sugg" class="sugg" hidden></ul>
  </div>

  <section id="dock" class="glass blk" data-k="dock"><div id="icons"></div></section>
</main>

<dialog id="dlg" class="glass">
  <form id="dlgForm">
    <h2 id="dlgTitle">Add shortcut</h2>
    <input id="dName" placeholder="Name" maxlength="24" autocomplete="off">
    <input id="dUrl" placeholder="Website, e.g. youtube.com" required autocomplete="off">
    <div class="btns">
      <button type="button" id="dCancel" class="pill ghost">Cancel</button>
      <button type="submit" class="pill">Save</button>
    </div>
  </form>
</dialog>

<div id="ctx" class="glass pop" hidden>
  <button data-a="edit">Edit</button>
  <button data-a="del">Remove</button>
</div>

<script src="newtab.js"></script>
</body>
</html>
